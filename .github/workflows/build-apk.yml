name: Build Mowajeh APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          test -f project.zip
          echo "project.zip found successfully"

      - name: Extract project ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q project.zip -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Gradle project
        run: |
          PROJECT_DIR=$(find extracted -type f -name "settings.gradle" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -type f -name "build.gradle" -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle project found inside project.zip"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project found at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check Gradle project
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle" || test -f "$PROJECT_DIR/build.gradle.kts"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" Mowajeh.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mowajeh-apk
          path: Mowajeh.apk
