name: Build Mowajeh APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          if [ ! -f "project.zip" ]; then
            echo "ERROR: project.zip not found!"
            exit 1
          fi

          echo "Found project.zip"
          ls -lh project.zip

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q "project.zip" -d project

          echo "Project extracted successfully"
          find project -maxdepth 2 -type f | head -50

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check Gradle project
        working-directory: project
        run: |
          echo "Gradle project contents:"
          ls -la

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "APK files:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mowajeh-smart-apk-new
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
